name: toolbox

on:
  push:
    tags:
      - 'toolbox-[0-9]*.[0-9]*.[0-9]*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag and extract version
        id: version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^toolbox-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' is not a valid toolbox semver tag (toolbox-X.Y.Z)" >&2
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./toolbox
          push: true
          tags: envisia/toolbox:${{ steps.version.outputs.version }}
